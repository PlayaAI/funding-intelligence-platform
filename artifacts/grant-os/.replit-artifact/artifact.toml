kind = "web"
previewPath = "/"
title = "Grant OS"
version = "1.0.0"
id = "artifacts/grant-os"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24429

[services.development]
run = "pnpm --filter @workspace/grant-os run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/grant-os", "run", "build"]

[services.production.run]
args = ["pnpm", "--filter", "@workspace/grant-os", "run", "start"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.env]
PORT = "24429"
BASE_PATH = "/"
